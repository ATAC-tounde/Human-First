name: THINK FIRST checks
on:
  push:
    branches: [main]
  pull_request: # vérifier aussi les PR empilées sur une branche de préproduction
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation and Node tests
        run: npm run check